# Lightsail (or any Linux VM): `docker compose up -d --build`. Config in .env (see deploy/env.example).
services:
  crm:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - CRM_UI=${CRM_UI:-vite}       # vite = live code (Build mode); dist = built UI only
    volumes:
      - ./:/app                      # the repo: code (Build mode edits + commits it) and data/ (DB, PDFs, chat runs)
      - node_modules:/app/node_modules
      - ./claude-home:/home/node/.claude   # Claude CLI sessions (chat --resume)
    # No published ports: only the tunnel reaches it.

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on: [crm]

volumes:
  node_modules:
